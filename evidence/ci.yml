name: shop-trade-ci
# 说明：这是可执行的 CI 工作流定义（配置），本仓库当前没有该工作流的任何运行记录。
# 落地方式：复制到 .github/workflows/ci.yml 并关联远端仓库后，由真实 PR 触发。
on:
  push:
    branches: [dev/01, main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: gofmt 格式检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt 未通过："; echo "$out"; exit 1; fi

      - name: go vet 静态检查
        run: go vet ./...

      - name: go build 编译
        run: go build ./...

      - name: 单元测试
        run: go test -count=1 ./...

      - name: 竞态检测（ubuntu-latest 自带 gcc，可开启 CGO）
        run: CGO_ENABLED=1 go test -race ./... -count=1

      - name: 覆盖率统计
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: 覆盖率明细
        run: go tool cover -func=coverage.out

      - name: 上传覆盖率原始文件
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out